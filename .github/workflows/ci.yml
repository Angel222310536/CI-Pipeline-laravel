name: Laravel CI/CD Release Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repositorio
      uses: actions/checkout@v4

    - name: Configurar entorno PHP 8.2
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo

    - name: Validar archivo composer.json
      run: composer validate --no-check-publish

    - name: Instalar dependencias (Dev para pruebas)
      run: composer install --prefer-dist --no-interaction

    - name: Preparar entorno de pruebas
      run: |
        cp .env.example .env
        php artisan key:generate

    - name: Ejecutar pruebas automatizadas
      run: php artisan test

    - name: Optimizar e instalar dependencias de producción
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Generar artefacto de liberacion
      run: |
        tar --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='storage/logs/*' \
            -czf laravel-release.tar.gz .

    - name: Publicar artefacto
      uses: actions/upload-artifact@v4
      with:
        name: laravel-release
        path: laravel-release.tar.gz
        retention-days: 7